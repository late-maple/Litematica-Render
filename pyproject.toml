[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "litematica-render"
dynamic = ["version"]
description = "Parse Minecraft Litematica schematics and render them to isometric PNGs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "late-maple" }]
dependencies = ["numpy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics",
]

[project.urls]
Homepage = "https://github.com/late-maple/Litematica-Render"

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "Pillow>=9.1"]
pack = ["Pillow>=9.1"]

[tool.hatch.version]
path = "src/litematic/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/litematic"]

[tool.ruff.lint]
select = ["E", "F", "I"]
